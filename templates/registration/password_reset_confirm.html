{% extends "base.html" %}

{% block content %}
    <h2>Set a New Password</h2>
    
    {% if validlink %}
        <p>Enter a new password below:</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Reset Password</button>
        </form>
    {% else %}
        <p>This reset link is invalid or has expired.</p>
    {% endif %}
{% endblock %}
