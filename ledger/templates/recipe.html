{% extends "base.html" %}

{% block title %}{{ name }}{% endblock %}

{% block content %}
    <section>
        <header>
            <h2>{{ name }}</h2>
        </header>
        <article>
            <p><strong>Ingredients:</strong></p>
            <ul>
                {% for ingredient in ingredients %}
                    <li>{{ ingredient.quantity }} of {{ ingredient.name }}</li>
                {% endfor %}
            </ul>
        </article>
    </section>
{% endblock %}
