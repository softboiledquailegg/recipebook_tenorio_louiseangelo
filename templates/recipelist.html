{% extends "base.html" %}
{% block content %}
    <h2>Recipe List</h2>
    {% if recipes %}
        <ul>
            {% for recipe in recipes %}
                <li>
                    <a href="{% url 'ledger:recipe_detail' recipe.id %}">{{ recipe.title }}</a>
                    <p>{{ recipe.description }}</p>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No recipes found.</p>
    {% endif %}
{% endblock %}
